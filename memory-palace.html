<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Memory Palace</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

:root {
  --bg: #0a0e27;
  --card: #1a1f3a;
  --accent: #667eea;
  --accent-bright: #00ff41;
  --text: #ffffff;
  --text-muted: #a0aec0;
  --border: rgba(102, 126, 234, 0.2);
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  touch-action: pan-y;
}

/* Header */
.header {
  background: rgba(26, 31, 58, 0.95);
  backdrop-filter: blur(20px);
  padding: 1rem 1.5rem;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 100;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-size: 1.25rem;
  font-weight: 700;
  background: linear-gradient(135deg, var(--accent), var(--accent-bright));
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}

.breadcrumb {
  font-size: 0.85rem;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.breadcrumb-link {
  cursor: pointer;
  transition: color 0.2s;
}

.breadcrumb-link:hover {
  color: var(--accent-bright);
}

/* Main Content */
.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 2rem 1rem;
}

/* Universe View */
.universe-title {
  font-size: 2rem;
  font-weight: 700;
  text-align: center;
  margin-bottom: 0.5rem;
  letter-spacing: -0.5px;
}

.universe-subtitle {
  text-align: center;
  color: var(--text-muted);
  margin-bottom: 2.5rem;
  font-size: 0.95rem;
}

.palaces-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 1.25rem;
}

.palace-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 1.75rem;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
  overflow: hidden;
}

.palace-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--accent), var(--accent-bright));
  transform: scaleX(0);
  transition: transform 0.3s;
}

.palace-card:hover {
  transform: translateY(-4px);
  border-color: var(--accent-bright);
  box-shadow: 0 8px 24px rgba(0, 255, 65, 0.15);
}

.palace-card:hover::before {
  transform: scaleX(1);
}

.palace-icon {
  font-size: 2.5rem;
  margin-bottom: 1rem;
  display: block;
}

.palace-name {
  font-size: 1.25rem;
  font-weight: 600;
  margin-bottom: 0.5rem;
}

.palace-description {
  color: var(--text-muted);
  font-size: 0.875rem;
  margin-bottom: 1rem;
  line-height: 1.5;
}

.palace-stats {
  display: flex;
  gap: 1rem;
  color: var(--text-muted);
  font-size: 0.85rem;
}

/* Palace View */
.palace-header {
  text-align: center;
  margin-bottom: 2.5rem;
}

.palace-header-icon {
  font-size: 3.5rem;
  margin-bottom: 0.75rem;
}

.palace-header-title {
  font-size: 2rem;
  font-weight: 700;
  margin-bottom: 0.5rem;
  letter-spacing: -0.5px;
}

.palace-header-meta {
  color: var(--text-muted);
  margin-bottom: 1.5rem;
}

.btn {
  padding: 0.75rem 1.5rem;
  border: none;
  border-radius: 8px;
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
}

.btn-primary {
  background: linear-gradient(135deg, var(--accent), #764ba2);
  color: var(--text);
}

.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
}

.locations-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 1rem;
}

.location-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 1.25rem;
  cursor: pointer;
  transition: all 0.25s;
  position: relative;
}

.location-card:hover {
  transform: translateY(-2px);
  border-color: var(--accent);
}

.location-number {
  position: absolute;
  top: 0.75rem;
  right: 0.75rem;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: rgba(102, 126, 234, 0.2);
  color: var(--accent);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.75rem;
  font-weight: 600;
}

.location-name {
  font-size: 1rem;
  font-weight: 600;
  margin-bottom: 0.5rem;
  padding-right: 2rem;
}

.location-preview {
  color: var(--text-muted);
  font-size: 0.8rem;
  line-height: 1.4;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* Location Detail View */
.location-view {
  max-width: 800px;
  margin: 0 auto;
}

.location-hero {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 2rem;
  margin-bottom: 2rem;
  text-align: center;
}

.location-title {
  font-size: 1.75rem;
  font-weight: 700;
  margin-bottom: 0.75rem;
}

.location-context {
  color: var(--text-muted);
  margin-bottom: 1.5rem;
}

.location-memory {
  background: rgba(102, 126, 234, 0.08);
  border-left: 4px solid var(--accent);
  padding: 1.25rem;
  border-radius: 0 8px 8px 0;
  line-height: 1.7;
  text-align: left;
  color: #e2e8f0;
}

/* Navigation */
.nav-controls {
  display: flex;
  gap: 1rem;
  justify-content: center;
  margin-top: 2rem;
  touch-action: manipulation;
}

.nav-btn {
  padding: 0.875rem 1.75rem;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text);
  border-radius: 10px;
  cursor: pointer;
  font-size: 0.9rem;
  font-weight: 600;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.nav-btn:hover:not(:disabled) {
  border-color: var(--accent-bright);
  background: rgba(0, 255, 65, 0.05);
}

.nav-btn:disabled {
  opacity: 0.3;
  cursor: not-allowed;
}

/* Swipe Indicator */
.swipe-hint {
  text-align: center;
  color: var(--text-muted);
  font-size: 0.8rem;
  margin-top: 1rem;
  opacity: 0.6;
}

/* Loading State */
.loading {
  text-align: center;
  padding: 4rem 2rem;
  color: var(--text-muted);
}

.loading-icon {
  font-size: 2rem;
  margin-bottom: 1rem;
  animation: pulse 1.5s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 0.4; }
  50% { opacity: 1; }
}

/* Mobile Optimizations */
@media (max-width: 768px) {
  .container {
    padding: 1.5rem 1rem;
  }
  
  .universe-title {
    font-size: 1.75rem;
  }
  
  .palaces-grid {
    grid-template-columns: 1fr;
  }
  
  .locations-grid {
    grid-template-columns: 1fr;
  }
  
  .nav-controls {
    flex-direction: column;
  }
  
  .nav-btn {
    width: 100%;
    justify-content: center;
  }
  
  .location-hero {
    padding: 1.5rem;
  }
  
  .location-title {
    font-size: 1.5rem;
  }
}

/* Edit Mode */
.edit-btn {
  background: rgba(102, 126, 234, 0.1);
  border: 1px solid var(--accent);
  color: var(--accent);
  padding: 0.5rem 1rem;
  border-radius: 6px;
  cursor: pointer;
  font-size: 0.85rem;
  font-weight: 600;
  transition: all 0.2s;
  margin-top: 1rem;
}

.edit-btn:hover {
  background: rgba(102, 126, 234, 0.2);
  transform: translateY(-1px);
}

textarea.edit-memory {
  width: 100%;
  min-height: 120px;
  padding: 1rem;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: rgba(10, 14, 39, 0.6);
  color: var(--text);
  font-family: inherit;
  font-size: 0.95rem;
  line-height: 1.7;
  resize: vertical;
  margin-top: 1rem;
}

textarea.edit-memory:focus {
  outline: none;
  border-color: var(--accent-bright);
  box-shadow: 0 0 0 3px rgba(0, 255, 65, 0.1);
}

.edit-actions {
  display: flex;
  gap: 0.75rem;
  margin-top: 1rem;
  justify-content: flex-end;
}

.btn-save {
  background: linear-gradient(135deg, var(--accent), #764ba2);
  color: var(--text);
  border: none;
  padding: 0.65rem 1.5rem;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 600;
  font-size: 0.9rem;
  transition: all 0.2s;
}

.btn-save:hover {
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
}

.btn-cancel {
  background: rgba(255, 255, 255, 0.05);
  color: var(--text-muted);
  border: 1px solid var(--border);
  padding: 0.65rem 1.5rem;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 600;
  font-size: 0.9rem;
  transition: all 0.2s;
}

.btn-cancel:hover {
  background: rgba(255, 255, 255, 0.1);
}

/* Touch feedback */
@media (hover: none) {
  .palace-card:active,
  .location-card:active,
  .nav-btn:active {
    transform: scale(0.98);
  }
}
</style>
</head>
<body>

<header class="header">
  <div class="logo">🏛️ MEMORY PALACE</div>
  <div class="breadcrumb" id="breadcrumb"></div>
</header>

<main class="container" id="app">
  <div class="loading">
    <div class="loading-icon">⏳</div>
    <div>Loading your memory palace...</div>
  </div>
</main>

<script>
// MEMORY PALACE DATA
const PALACES = {
  edinburgh: {
    id: 'edinburgh',
    name: 'Edinburgh',
    icon: '🏔️',
    description: 'Personal Mastery & Discipline',
    locations: [
      { name: "Arthur's Seat", memory: "Get Up Early: Waking up early sets the tone for the day, allowing you to get a head start and accomplish tasks without distractions." },
      { name: "Palace Car Park", memory: "Exercise Daily: Physical fitness is crucial for maintaining mental and physical health, enhancing discipline, and building resilience." },
      { name: "Holyrood Palace", memory: "Set Goals: Clearly defined goals provide direction and purpose. Break them down into smaller, manageable tasks and tackle them systematically." },
      { name: "Royal Mile", memory: "Prioritize and Execute: Identify the most critical tasks and focus on them first. Avoid getting overwhelmed by tackling one thing at a time." },
      { name: "Radisson", memory: "Practice Self-Discipline: Cultivate the habit of doing what needs to be done, even when you don't feel like it. Consistent effort leads to success." },
      { name: "Edinburgh Castle", memory: "Embrace the Suck: Accept that challenges and hardships are part of the journey. Embrace them as opportunities to grow stronger." },
      { name: "Camera Obscura", memory: "Stay Humble: Recognize your weaknesses and continuously seek improvement. Learn from others and remain open to feedback." },
      { name: "Stairs", memory: "Be Prepared: Always be ready for unexpected challenges. Train and prepare yourself mentally and physically to handle adversity." },
      { name: "Coffee Shop", memory: "Take Ownership: Accept responsibility for your actions and outcomes. Blaming others or external factors undermines your ability to improve and succeed." },
      { name: "Waverley Station", memory: "Lead by Example: Demonstrate discipline and dedication in your actions to inspire and motivate others around you." }
    ]
  },
  
  northBerwick: {
    id: 'northBerwick',
    name: 'North Berwick',
    icon: '🌊',
    description: 'Visualization & Creative Techniques',
    locations: [
      { name: "Belhaven Breakfast", memory: "Find a Quiet Space: Create a peaceful environment free from distractions to focus your mind." },
      { name: "Putting Green", memory: "Relaxation Techniques: Use deep breathing and progressive muscle relaxation to enter a calm state." },
      { name: "Beach", memory: "Identify Your Goal: Clearly define what you want to visualize and achieve." },
      { name: "Harbour", memory: "Set the Scene: Imagine yourself in the environment where your goal takes place." },
      { name: "Dino's Fish & Chips", memory: "Visualize the Starting Point: See yourself beginning the journey toward your goal." },
      { name: "Park", memory: "Engage All Senses: Feel, hear, smell, taste, and see every detail of your visualization." },
      { name: "Jobbo Mart Coffee", memory: "Develop the Narrative: Create a story that unfolds naturally toward your desired outcome." },
      { name: "Car Park", memory: "Include Emotional Elements: Feel the emotions of success, joy, and accomplishment." },
      { name: "The Law", memory: "Visualize the Outcome: Clearly see yourself achieving your goal in vivid detail." },
      { name: "The Lodge", memory: "Repetition: Practice your visualization regularly to reinforce neural pathways." }
    ]
  }
};

// APP STATE
class MemoryPalace {
  constructor() {
    this.state = {
      view: 'universe',
      currentPalace: null,
      currentLocationIndex: 0,
      isEditing: false
    };
    
    this.touchStartX = 0;
    this.touchEndX = 0;
    
    // Load custom data from localStorage
    this.loadCustomData();
    
    this.init();
  }
  
  loadCustomData() {
    const saved = localStorage.getItem('memoryPalaceData');
    if (saved) {
      try {
        const customData = JSON.parse(saved);
        // Merge custom data with default PALACES
        Object.keys(customData).forEach(palaceId => {
          if (PALACES[palaceId]) {
            customData[palaceId].locations.forEach((customLoc, index) => {
              if (PALACES[palaceId].locations[index]) {
                PALACES[palaceId].locations[index].memory = customLoc.memory;
              }
            });
          }
        });
      } catch (e) {
        console.error('Error loading custom data:', e);
      }
    }
  }
  
  saveCustomData() {
    localStorage.setItem('memoryPalaceData', JSON.stringify(PALACES));
  }
  
  toggleEdit() {
    this.state.isEditing = !this.state.isEditing;
    this.render();
  }
  
  saveMemory(palaceId, locationIndex, newMemory) {
    if (PALACES[palaceId] && PALACES[palaceId].locations[locationIndex]) {
      PALACES[palaceId].locations[locationIndex].memory = newMemory;
      this.saveCustomData();
      this.state.isEditing = false;
      this.render();
    }
  }
  
  cancelEdit() {
    this.state.isEditing = false;
    this.render();
  }
  
  init() {
    this.setupSwipeListeners();
    this.render();
  }
  
  setupSwipeListeners() {
    const app = document.getElementById('app');
    
    app.addEventListener('touchstart', (e) => {
      this.touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });
    
    app.addEventListener('touchend', (e) => {
      this.touchEndX = e.changedTouches[0].screenX;
      this.handleSwipe();
    }, { passive: true });
  }
  
  handleSwipe() {
    const diff = this.touchStartX - this.touchEndX;
    const threshold = 50;
    
    if (Math.abs(diff) > threshold && this.state.view === 'location') {
      if (diff > 0) {
        // Swipe left - next
        this.navigateNext();
      } else {
        // Swipe right - previous
        this.navigatePrev();
      }
    }
  }
  
  navigateTo(view, palaceId = null, locationIndex = 0) {
    this.state = { view, currentPalace: palaceId, currentLocationIndex: locationIndex };
    this.render();
  }
  
  navigateNext() {
    if (!this.state.currentPalace) return;
    const palace = PALACES[this.state.currentPalace];
    if (this.state.currentLocationIndex < palace.locations.length - 1) {
      this.state.currentLocationIndex++;
      this.render();
    }
  }
  
  navigatePrev() {
    if (this.state.currentLocationIndex > 0) {
      this.state.currentLocationIndex--;
      this.render();
    }
  }
  
  updateBreadcrumb() {
    const breadcrumb = document.getElementById('breadcrumb');
    
    if (this.state.view === 'universe') {
      breadcrumb.innerHTML = '<span>All Palaces</span>';
    } else if (this.state.view === 'palace') {
      const palace = PALACES[this.state.currentPalace];
      breadcrumb.innerHTML = `
        <span class="breadcrumb-link" onclick="app.navigateTo('universe')">All Palaces</span>
        <span>→</span>
        <span>${palace.icon} ${palace.name}</span>
      `;
    } else if (this.state.view === 'location') {
      const palace = PALACES[this.state.currentPalace];
      const location = palace.locations[this.state.currentLocationIndex];
      breadcrumb.innerHTML = `
        <span class="breadcrumb-link" onclick="app.navigateTo('universe')">All Palaces</span>
        <span>→</span>
        <span class="breadcrumb-link" onclick="app.navigateTo('palace', '${palace.id}')">${palace.icon} ${palace.name}</span>
        <span>→</span>
        <span>${location.name}</span>
      `;
    }
  }
  
  render() {
    this.updateBreadcrumb();
    const app = document.getElementById('app');
    
    if (this.state.view === 'universe') {
      app.innerHTML = this.renderUniverse();
    } else if (this.state.view === 'palace') {
      app.innerHTML = this.renderPalace();
    } else if (this.state.view === 'location') {
      app.innerHTML = this.renderLocation();
    }
  }
  
  renderUniverse() {
    const palaceCards = Object.values(PALACES).map(palace => `
      <div class="palace-card" onclick="app.navigateTo('palace', '${palace.id}')">
        <span class="palace-icon">${palace.icon}</span>
        <div class="palace-name">${palace.name}</div>
        <div class="palace-description">${palace.description}</div>
        <div class="palace-stats">
          <span>📍 ${palace.locations.length} locations</span>
        </div>
      </div>
    `).join('');
    
    return `
      <h1 class="universe-title">Your Memory Palaces</h1>
      <p class="universe-subtitle">${Object.keys(PALACES).length} palaces ready to explore</p>
      <div class="palaces-grid">${palaceCards}</div>
    `;
  }
  
  renderPalace() {
    const palace = PALACES[this.state.currentPalace];
    const locationCards = palace.locations.map((location, index) => `
      <div class="location-card" onclick="app.navigateTo('location', '${palace.id}', ${index})">
        <div class="location-number">${index + 1}</div>
        <div class="location-name">${location.name}</div>
        <div class="location-preview">${location.memory.substring(0, 80)}...</div>
      </div>
    `).join('');
    
    return `
      <div class="palace-header">
        <div class="palace-header-icon">${palace.icon}</div>
        <h1 class="palace-header-title">${palace.name}</h1>
        <p class="palace-header-meta">${palace.description} • ${palace.locations.length} locations</p>
      </div>
      <div class="locations-grid">${locationCards}</div>
    `;
  }
  
  renderLocation() {
    const palace = PALACES[this.state.currentPalace];
    const location = palace.locations[this.state.currentLocationIndex];
    const canPrev = this.state.currentLocationIndex > 0;
    const canNext = this.state.currentLocationIndex < palace.locations.length - 1;
    
    if (this.state.isEditing) {
      return `
        <div class="location-view">
          <div class="location-hero">
            <h1 class="location-title">${location.name}</h1>
            <p class="location-context">${palace.name} • Location ${this.state.currentLocationIndex + 1} of ${palace.locations.length}</p>
            <p style="color: var(--text-muted); margin-top: 1rem; font-size: 0.9rem;">✏️ Edit the memory content below:</p>
            <textarea class="edit-memory" id="memoryEditor">${location.memory}</textarea>
            <div class="edit-actions">
              <button class="btn-cancel" onclick="app.cancelEdit()">Cancel</button>
              <button class="btn-save" onclick="app.saveMemory('${palace.id}', ${this.state.currentLocationIndex}, document.getElementById('memoryEditor').value)">💾 Save Changes</button>
            </div>
          </div>
        </div>
      `;
    }
    
    return `
      <div class="location-view">
        <div class="location-hero">
          <h1 class="location-title">${location.name}</h1>
          <p class="location-context">${palace.name} • Location ${this.state.currentLocationIndex + 1} of ${palace.locations.length}</p>
          <div class="location-memory">${location.memory}</div>
          <button class="edit-btn" onclick="app.toggleEdit()">✏️ Edit Memory</button>
        </div>
        
        <div class="nav-controls">
          <button class="nav-btn" ${!canPrev ? 'disabled' : ''} onclick="app.navigatePrev()">
            ← Previous
          </button>
          <button class="nav-btn" onclick="app.navigateTo('palace', '${palace.id}')">
            📍 All Locations
          </button>
          <button class="nav-btn" ${!canNext ? 'disabled' : ''} onclick="app.navigateNext()">
            Next →
          </button>
        </div>
        
        <div class="swipe-hint">💡 Swipe left/right on mobile to navigate</div>
      </div>
    `;
  }
}

// Initialize app
const app = new MemoryPalace();
</script>

</body>
</html>
